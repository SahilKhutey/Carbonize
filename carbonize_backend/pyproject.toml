[project]
name = "carbonize-backend"
version = "2.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "celery==5.4.0",
    "redis==5.0.8",
    "mlflow==2.16.0",
    "ultralytics==8.3.0",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "opencv-python==4.10.0.84",
    "pydantic==2.9.2",
    "python-multipart==0.0.10",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "prometheus-client==0.20.0",
    "psutil==6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.8",
    "mypy==1.11.2",
    "httpx==0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "PT", "Q"]
