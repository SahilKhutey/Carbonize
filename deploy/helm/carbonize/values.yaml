# Default values for Carbonize
global:
  imageRegistry: ghcr.io/carbonize
  imagePullPolicy: IfNotPresent
  storageClass: gp3

backend:
  replicaCount: 3
  image:
    repository: backend
    tag: latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilization: 70

ingestion:
  replicaCount: 2
  image:
    repository: ingestion
    tag: latest
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

kafka:
  enabled: true
  replicas: 3
  storage: 100Gi
  retentionMs: 604800000

postgresql:
  enabled: true
  primary:
    replicaCount: 1
    resources:
      cpu: 2000m
      memory: 8Gi
    storage: 100Gi
  readReplicas:
    replicaCount: 2
    resources:
      cpu: 1000m
      memory: 4Gi

redis:
  enabled: true
  replicaCount: 3
  memory: 4Gi

mlInference:
  replicaCount: 2
  gpu:
    enabled: true
    type: nvidia-tesla-t4
    count: 1
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi

frontend:
  replicaCount: 2
  image:
    repository: frontend
    tag: latest
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: dashboard.carbonize.io
        paths:
          - path: /
            pathType: Prefix
