environments:
  test:
    docker_network: carbonize-test-net
    docker_registry: ghcr.io/carbonize
    images:
      sim: carbonize/sim:latest
      backend: carbonize/backend:latest
      inference: carbonize/inference:latest
    
    timeouts:
      system_ready: 60
      scenario_complete: 120
      network_recovery: 30
    
    artifacts:
      retention_days: 30
      upload_to: s3://carbonize-test-artifacts/

logging:
  level: INFO
  format: json
  destinations:
    - console
    - file: tests/logs/e2e.log
